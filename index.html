<!DOCTYPE html>
<html>
<head>
  <base href="/balanza_app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="balanza_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>balanza_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Registro del Service Worker para forzar actualización en iOS/Safari
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        // Incrementa solo este número (?v=1.0.2, ?v=1.0.3, etc.) en cada publicación
        navigator.serviceWorker.register('flutter_service_worker.js?v=1.0.1')
          .then(function (reg) {
            reg.onupdatefound = function () {
              var installer = reg.installing;
              installer.onstatechange = function () {
                if (installer.state === 'installed' && navigator.serviceWorker.controller) {
                  // Si detecta nueva versión en el servidor, recarga la PWA
                  window.location.reload();
                }
              };
            };
          });
      });
    }
  </script>

  <!-- Carga principal de Flutter Web (Sin parámetros URL para evitar errores) -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
