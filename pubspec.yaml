name: balanza_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  country_flags: ^2.1.0
  cupertino_icons: ^1.0.8
  printing: ^5.15.0
  pdf: ^3.13.0
  package_info_plus: ^8.0.0
  ota_update: ^7.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  web:
    generate: true
    image_path: "assets/app_icon.png"