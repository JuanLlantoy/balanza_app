<!DOCTYPE html>
<html>
<head>
  <base href="/balanza_app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="balanza_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>balanza_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      // 1. Forzar la eliminación de workers antiguos guardados en el iPhone
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });

      // 2. Registrar la versión actual
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=1.0.2')
          .then(function (reg) {
            reg.onupdatefound = function () {
              var installer = reg.installing;
              installer.onstatechange = function () {
                if (installer.state === 'installed' && navigator.serviceWorker.controller) {
                  window.location.reload();
                }
              };
            };
          });
      });
    }
  </script>

  <!-- Carga de Flutter Web forzando renderizador HTML compatible -->
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      config: {
        renderer: "html"
      }
    });
  </script>
</body>
</html>
